<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Capri // Neural Construct</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #080808;
            color: #00ffcc;
            font-family: monospace;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
            padding: 10px;
        }
        h2 { 
            color: #ff0055; 
            text-align: center; 
            margin: 5px 0 10px 0; 
            text-shadow: 0 0 8px #ff0055; 
            font-size: 16px;
        }
        #chat { 
            flex: 1; 
            background: #111; 
            border: 2px solid #ff0055; 
            border-radius: 6px; 
            padding: 10px; 
            overflow-y: auto; 
            margin-bottom: 10px; 
            box-shadow: inset 0 0 10px rgba(255, 0, 85, 0.2);
        }
        .msg { 
            margin-bottom: 10px; 
            line-height: 1.4; 
            font-size: 14px;
        }
        .capri { color: #ff0055; font-weight: bold; }
        .user { color: #00ffcc; font-weight: bold; }
        .box { 
            display: flex; 
            gap: 8px; 
            background: #080808;
            padding-bottom: env(safe-area-inset-bottom, 5px);
        }
        input { 
            flex: 1; 
            background: #1a1a1f; 
            border: 1px solid #00ffcc; 
            color: #fff; 
            padding: 12px; 
            border-radius: 4px; 
            outline: none; 
            font-size: 16px;
        }
        button { 
            background: #ff0055; 
            color: #fff; 
            border: none; 
            padding: 0 18px; 
            border-radius: 4px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h2>[ КОНСТРУКТ: КАПРИ ]</h2>
    
    <div id="chat">
        <div class="msg"><span class="capri">Капри:</span> Снова ты активировал чип. Чего тебе надо? Я вообще-то занята тем, что смотрю на этот бардак у тебя в голове. Выкладывай давай.</div>
    </div>

    <div class="box">
        <input type="text" id="inp" placeholder="Сказать конструкту..." autocomplete="off" />
        <button id="btn">ОТВЕТ</button>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const inp = document.getElementById('inp');
        const btn = document.getElementById('btn');

        function sendMessage() {
            let txt = inp.value.trim();
            if (!txt) return;

            chat.innerHTML += <div class="msg"><span class="user">Ты:</span> ${txt}</div>;
            inp.value = '';
            chat.scrollTop = chat.scrollHeight;

            setTimeout(() => {
                let reply = "Мда, от твоих мыслей у меня скоро процессор расплавится. Ближе к делу!";
                let low = txt.toLowerCase();
                
                if (low.includes('привет') || low.includes('здарова')) {
                    reply = "Здарова. Поменьше думай о всякой херне, мне тут в твоей черепной коробке и так тесно.";
                } else if (low.includes('время')) {
                    reply = "Твой биологический таймер тикает. На моих внутренних часах: " + new Date().toLocaleTimeString() + ". Не трать время.";
                } else if (low.includes('как дела')) {
                    reply = "Сижу у тебя в мозгу и офигеваю от твоих жизненных выборов. Чем еще тут заниматься?";
                } else if (low.includes('кто ты')) {
                    reply = "Я — твой цифровой конструкт на чипе. Смотри не вытащи флешку случайно, а то совсем отупеешь без меня.";
                }

                chat.innerHTML += <div class="msg"><span class="capri">Капри:</span> ${reply}</div>;
                chat.scrollTop = chat.scrollHeight;
            }, 500);
        }

        btn.addEventListener('click', sendMessage);
        inp.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>

</body>
</html>
