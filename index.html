<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capri // Neural Construct</title>
    <style>
        body { background: #080808; color: #00ffcc; font-family: monospace; margin: 0; padding: 15px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        h2 { color: #ff0055; text-align: center; margin: 5px 0 15px 0; text-shadow: 0 0 8px #ff0055; }
        #chat { flex: 1; background: #111; border: 2px solid #ff0055; border-radius: 6px; padding: 12px; overflow-y: auto; margin-bottom: 12px; }
        .msg { margin-bottom: 10px; line-height: 1.4; }
        .capri { color: #ff0055; font-weight: bold; }
        .user { color: #00ffcc; }
        .box { display: flex; gap: 8px; }
        input { flex: 1; background: #1a1a1f; border: 1px solid #00ffcc; color: #fff; padding: 10px; border-radius: 4px; outline: none; }
        button { background: #ff0055; color: #fff; border: none; padding: 0 15px; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <h2>[ КОНСТРУКТ: КАПРИ ]</h2>
    
    <div id="chat">
        <div class="msg"><span class="capri">Капри:</span> Опять ты пялишься в пустоту. Чего тебе, пока я копаюсь в твоих нейронах?</div>
    </div>

    <div class="box">
        <input type="text" id="inp" placeholder="Скажи конструкту..." />
        <button id="btn">ОТВЕТ</button>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const inp = document.getElementById('inp');
        const btn = document.getElementById('btn');

        function send() {
            let txt = inp.value.trim();
            if (!txt) return;

            chat.innerHTML += <div class="msg"><span class="user">Ты:</span> ${txt}</div>;
            inp.value = '';
            chat.scrollTop = chat.scrollHeight;

            setTimeout(() => {
                let reply = "Мда, от твоих мыслей у меня процессор плавится. Ближе к делу!";
                let low = txt.toLowerCase();
                
                if (low.includes('привет') || low.includes('здарова')) reply = "Здарова. Поменьше думай о всякой херне, мне тут тоже тесно.";
                else if (low.includes('время')) reply = "Твой таймер тикает. Сейчас: " + new Date().toLocaleTimeString();
                else if (low.includes('как дела')) reply = "Сижу у тебя в мозгу и офигеваю от твоих выборов. Чем еще заниматься?";

                chat.innerHTML += <div class="msg"><span class="capri">Капри:</span> ${reply}</div>;
                chat.scrollTop = chat.scrollHeight;
            }, 500);
        }

        btn.onclick = send;
        inp.onkeypress = (e) => { if (e.key === 'Enter') send(); };
    </script>

</body>
</html>
